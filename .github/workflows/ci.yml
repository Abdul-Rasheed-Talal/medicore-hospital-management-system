# MediCore CI — docs/spec gates plus code jobs.
# Backend (pytest) and frontend (Vitest + build) run on every push and PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Docs and spec checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f .env.example
          test -f .specify/memory/constitution.md
          test -f specs/001-patient-registration/spec.md
          test -f specs/001-patient-registration/plan.md
          test -f docs/adr/001-stack.md
          echo "Required docs present."

      - name: No secrets committed (basic scan)
        run: |
          if [ -f .env ]; then echo ".env must never be committed" >&2; exit 1; fi
          if grep -rInE "(SECRET_KEY|PASSWORD|TOKEN)[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}" --include="*.md" --include="*.yml" --include="*.yaml" . | grep -v ".env.example"; then echo "Possible secret committed — see matches above" >&2; exit 1; fi
          echo "Secret scan done (placeholder values in .env.example are allowed)."

      - name: Markdown files are non-empty
        run: |
          for f in README.md specs/001-patient-registration/spec.md specs/001-patient-registration/plan.md; do test -s "$f" || { echo "$f is empty" >&2; exit 1; }; done
          echo "Markdown checks passed."

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: python -m pytest
        working-directory: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Vitest
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E
        run: npm run test:e2e
        working-directory: frontend
